    config/manifests: {area: Release and packaging, approvers: [release-owners], reviewers: [release-reviewers], labels: [area/release]}
    validators: {area: Release and packaging, approvers: [release-owners], reviewers: [release-reviewers], labels: [area/release]}
    .tekton: {area: Release and packaging, approvers: [release-owners], reviewers: [release-reviewers], labels: [area/release]}
